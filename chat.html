<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073f33">
  <meta name="description" content="Chat with Maryam, the main Nur AI agent for marketing, content, and growth.">
  <title>Nur AI — Chat with Maryam</title>
  <style>
    :root {
      color-scheme: light;
      --emerald-950: #052e26;
      --emerald-900: #073f33;
      --emerald-800: #0b5846;
      --emerald-100: #dceee8;
      --gold: #c8a75b;
      --gold-light: #ead8a8;
      --ink: #17231f;
      --muted: #68756f;
      --paper: #fff;
      --canvas: #f5f3ed;
      --line: #e3e6e0;
      --shadow: 0 22px 70px rgba(5, 46, 38, .14);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 2%, rgba(200, 167, 91, .15), transparent 27rem),
        radial-gradient(circle at 92% 100%, rgba(11, 88, 70, .12), transparent 32rem),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; }

    .shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(100% - 32px, 900px);
      height: min(100dvh - 32px, 920px);
      margin: 16px auto;
      overflow: hidden;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 84px;
      padding: 18px 24px;
      background: linear-gradient(130deg, var(--emerald-950), var(--emerald-900));
      color: white;
      border-bottom: 1px solid rgba(234, 216, 168, .24);
    }

    .brand, .status { display: flex; align-items: center; }
    .brand { gap: 13px; }

    .mark {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      flex: 0 0 auto;
      border: 1px solid rgba(234, 216, 168, .7);
      border-radius: 14px;
      background: rgba(255, 255, 255, .06);
      color: var(--gold-light);
      font-family: Georgia, serif;
      font-size: 23px;
      box-shadow: inset 0 0 24px rgba(200, 167, 91, .08);
    }

    .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .brand p { margin: 3px 0 0; color: rgba(255, 255, 255, .65); font-size: 12px; }

    .status {
      gap: 8px;
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      color: rgba(255, 255, 255, .83);
      font-size: 12px;
      font-weight: 650;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #65d6a6;
      box-shadow: 0 0 0 4px rgba(101, 214, 166, .12);
      animation: pulse 2s infinite;
    }

    .messages {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 30px 24px 22px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 0 0 18px;
      animation: arrive .25s ease-out both;
    }

    .message-row.user { justify-content: flex-end; }

    .avatar {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid #d7ddd8;
      border-radius: 10px;
      background: white;
      color: var(--emerald-900);
      font-family: Georgia, serif;
      font-weight: 700;
      box-shadow: 0 5px 16px rgba(5, 46, 38, .08);
    }

    .bubble {
      max-width: min(76%, 620px);
      padding: 13px 16px;
      border-radius: 18px 18px 18px 5px;
      background: white;
      border: 1px solid var(--line);
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 8px 28px rgba(5, 46, 38, .055);
    }

    .user .bubble {
      border-color: transparent;
      border-radius: 18px 18px 5px;
      background: var(--emerald-900);
      color: white;
      box-shadow: 0 9px 24px rgba(7, 63, 51, .18);
    }

    .message-meta {
      display: block;
      margin-bottom: 4px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .error .bubble {
      border-color: #f0c9c1;
      background: #fff8f6;
      color: #7a3025;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-800);
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .14s; }
    .typing span:nth-child(3) { animation-delay: .28s; }

    .composer-wrap {
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .9);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 8px 8px 16px;
      border: 1px solid #d8ded9;
      border-radius: 19px;
      background: white;
      box-shadow: 0 8px 26px rgba(5, 46, 38, .06);
      transition: border-color .2s, box-shadow .2s;
    }

    .composer:focus-within {
      border-color: rgba(7, 63, 51, .52);
      box-shadow: 0 0 0 4px rgba(7, 63, 51, .07);
    }

    textarea {
      width: 100%;
      min-height: 28px;
      max-height: 128px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      padding: 5px 0;
      background: transparent;
      color: var(--ink);
      line-height: 1.45;
    }

    textarea::placeholder { color: #95a09b; }

    .send {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      color: var(--emerald-950);
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(200, 167, 91, .23);
      transition: transform .15s, opacity .15s;
    }

    .send:hover { transform: translateY(-1px); }
    .send:active { transform: translateY(1px); }
    .send:disabled { cursor: not-allowed; opacity: .48; transform: none; }
    .send svg { width: 19px; height: 19px; }

    .hint {
      margin: 9px 4px 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 6px rgba(101, 214, 166, .04); }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    @media (max-width: 640px) {
      body { background: var(--paper); }
      .shell {
        width: 100%;
        height: 100dvh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .header { min-height: 74px; padding: 14px 16px; }
      .mark { width: 40px; height: 40px; border-radius: 12px; }
      .brand h1 { font-size: 18px; }
      .brand p { display: none; }
      .status { padding: 7px 9px; font-size: 11px; }
      .messages { padding: 22px 14px 16px; }
      .bubble { max-width: 86%; padding: 12px 14px; }
      .composer-wrap { padding: 10px 10px max(10px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Nur AI chat">
    <header class="header">
      <div class="brand">
        <div class="mark" aria-hidden="true">ن</div>
        <div>
          <h1>Nur AI</h1>
          <p>Guidance for content that grows with purpose</p>
        </div>
      </div>
      <div class="status" title="Nur AI service status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Agents Online</span>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite" aria-label="Conversation">
      <article class="message-row assistant">
        <div class="avatar" aria-hidden="true">M</div>
        <div class="bubble">
          <span class="message-meta">Maryam</span>
          Assalamu Alaikum. I’m Maryam, your main Nur AI agent. How can I help you today with marketing, content, or growth?
        </div>
      </article>
    </section>

    <footer class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1" maxlength="8000" aria-label="Message Maryam" placeholder="Message Maryam…" autocomplete="off"></textarea>
        <button class="send" id="sendButton" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m4 4 17 8-17 8 3-8-3-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M7 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
      <p class="hint">Enter to send · Shift + Enter for a new line</p>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      // Public endpoint only. Secrets belong in the Cloudflare Worker, never here.
      const API_URL = "https://nurai-agent-proxy.nurai.workers.dev";
      // Must match the PROXY_SECRET value set on the Worker
      const NUR_KEY = "REPLACE_WITH_YOUR_PROXY_SECRET";
      const REQUEST_TIMEOUT_MS = 45000;

      const form = document.getElementById("chatForm");
      const input = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const messages = document.getElementById("messages");

      // Store only successful turns. This history is sent with each request so
      // Maryam can retain context even if the Worker itself is stateless.
      const history = [];
      let pending = false;

      function scrollToLatest() {
        messages.scrollTop = messages.scrollHeight;
      }

      function resizeInput() {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 128)}px`;
      }

      function addMessage(role, text, options = {}) {
        const row = document.createElement("article");
        row.className = `message-row ${role}${options.error ? " error" : ""}`;

        if (role === "assistant") {
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.setAttribute("aria-hidden", "true");
          avatar.textContent = "M";
          row.appendChild(avatar);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (role === "assistant") {
          const meta = document.createElement("span");
          meta.className = "message-meta";
          meta.textContent = options.error ? "Connection notice" : "Maryam";
          bubble.appendChild(meta);
        }

        bubble.appendChild(document.createTextNode(text));
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollToLatest();
        return row;
      }

      function showTyping() {
        const row = document.createElement("article");
        row.className = "message-row assistant";
        row.id = "typingIndicator";
        row.setAttribute("aria-label", "Maryam is typing");
        row.innerHTML = `
          <div class="avatar" aria-hidden="true">M</div>
          <div class="bubble">
            <span class="message-meta">Maryam</span>
            <span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>
          </div>`;
        messages.appendChild(row);
        scrollToLatest();
      }

      function hideTyping() {
        document.getElementById("typingIndicator")?.remove();
      }

      function extractReply(data) {
        if (typeof data === "string" && data.trim()) return data.trim();
        if (!data || typeof data !== "object") return "";

        const direct = [
          data.reply,
          data.response,
          data.message,
          data.output,
          data.text,
          data.content,
          data.answer
        ].find(value => typeof value === "string" && value.trim());
        if (direct) return direct.trim();

        const nested = [
          data.result?.reply,
          data.result?.response,
          data.result?.message,
          data.result?.output,
          data.data?.reply,
          data.data?.response,
          data.data?.message
        ].find(value => typeof value === "string" && value.trim());
        if (nested) return nested.trim();

        const choice = data.choices?.[0]?.message?.content ?? data.choices?.[0]?.text;
        return typeof choice === "string" ? choice.trim() : "";
      }

      function buildPreviousOutputs() {
        const lastReply = [...history]
          .reverse()
          .find(turn => turn.role === "assistant" && turn.content);

        return lastReply ? { maryam: lastReply.content } : {};
      }

      async function requestMaryam(message) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        // Keep the deployed Worker's task-oriented fields while also sending
        // standard history fields for reliable multi-turn context.
        const conversation = [
          ...history,
          { role: "user", content: message }
        ];

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            mode: "cors",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "X-Nur-Key": NUR_KEY
            },
            body: JSON.stringify({
              agent: "maryam",
              action: message,
              message,
              brandProfile: {},
              project: { idea: message },
              previousOutputs: buildPreviousOutputs(),
              history,
              messages: conversation
            }),
            signal: controller.signal
          });

          const contentType = response.headers.get("content-type") || "";
          const raw = await response.text();
          let data = raw;

          if (contentType.includes("application/json") || raw.trim().startsWith("{")) {
            try { data = JSON.parse(raw); } catch { /* Keep the raw body for diagnostics. */ }
          }

          if (!response.ok) {
            const serverMessage = extractReply(data);
            throw new Error(serverMessage || `The Nur AI server returned HTTP ${response.status}.`);
          }

          const reply = extractReply(data);
          if (!reply) throw new Error("The Nur AI server returned an empty or unsupported response.");
          return reply;
        } finally {
          clearTimeout(timeout);
        }
      }

      function friendlyError(error) {
        if (error?.name === "AbortError") {
          return "The request took too long. Please try again in a moment.";
        }
        if (error instanceof TypeError) {
          return "I can’t reach the Nur AI server. The Worker may be offline or may need to allow this website in its CORS settings.";
        }
        return error?.message || "I’m having trouble reaching the server right now. Please try again in a moment.";
      }

      async function submitMessage() {
        const message = input.value.trim();
        if (!message || pending) return;

        pending = true;
        sendButton.disabled = true;
        input.disabled = true;
        input.value = "";
        resizeInput();
        addMessage("user", message);
        showTyping();

        try {
          const reply = await requestMaryam(message);
          hideTyping();
          addMessage("assistant", reply);
          history.push(
            { role: "user", content: message },
            { role: "assistant", content: reply }
          );
        } catch (error) {
          hideTyping();
          addMessage("assistant", friendlyError(error), { error: true });
          console.error("Nur AI request failed:", error);
        } finally {
          pending = false;
          sendButton.disabled = false;
          input.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        submitMessage();
      });

      input.addEventListener("input", resizeInput);
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          submitMessage();
        }
      });

      resizeInput();
      input.focus();
    })();
  </script>
</body>
</html>
